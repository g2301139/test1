<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイドバー折りたたみデモ</title>
  <style>
    /* 全体のレイアウト調整用 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #f1f5f9;
    }

    /* --- ここから提示されたCSSにトグル機能を盛り込んだもの --- */
    .sidebar {
      width: 380px; 
      min-width: 380px; 
      background: #fff; 
      border-right: 1px solid #e2e8f0;
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      flex-shrink: 0; 
      z-index: 10;
      
      /* スムーズに閉じるためのアニメーションを追加 */
      transition: margin-left 0.3s ease, width 0.3s ease, min-width 0.3s ease;
    }

    /* 【追加】サイドバーが隠れた状態のスタイル */
    .sidebar.collapsed {
      margin-left: -380px; /* 横幅分、左に引っ込める */
      width: 0;
      min-width: 0;
      border-right: none;  /* 境界線を消す */
    }

    .sidebar-scroll-wrapper { 
      display: flex; 
      flex-direction: column; 
      flex: 1; 
      overflow: hidden; 
    }

    .weather-advice { 
      padding: 12px 15px; 
      background: #f8fafc; 
      border-bottom: 1px solid #e2e8f0; 
      font-size: 13px; 
      line-height: 1.5; 
      color: #334155; 
    }
    .weather-advice h3 { 
      font-size: 14px; 
      color: #0f172a; 
      margin-top: 0; 
      margin-bottom: 6px; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }

    /* --- メインコンテンツ領域とトグルボタンのスタイル --- */
    .main-content {
      flex: 1;
      padding: 60px 20px 20px 20px; /* ボタンと被らないように上部を空ける */
      position: relative;
    }

    /* 開閉用のボタン */
    .toggle-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100; /* サイドバーより手前に表示 */
      padding: 8px 16px;
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      transition: background-color 0.2s;
    }
    .toggle-btn:hover {
      background-color: #1e293b;
    }
  </style>
</head>
<body>

  <!-- 開閉コントロールボタン（画面の左上に固定） -->
  <button class="toggle-btn" id="toggleBtn">📁 メニュー開閉</button>

  <!-- サイドバー -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-scroll-wrapper">
      <!-- 調整用の余白（ボタンとコンテンツが重ならないようにするため） -->
      <div style="height: 55px;"></div>
      
      <div class="weather-advice">
        <h3>
          <span>☀️</span>
          お天気アドバイス
        </h3>
        <p>今日は1日を通して晴れる見込みです。お出かけの際は熱中症対策を忘れずに！</p>
      </div>
      
      <div style="padding: 15px; font-size: 14px; color: #475569;">
        <p>その他のサイドバーコンテンツがここに並びます。</p>
      </div>
    </div>
  </aside>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <h1>メイン画面</h1>
    <p style="margin-top: 15px; color: #475569; line-height: 1.6;">
      左上のボタンを押すと、サイドバーが左側へスムーズに引っ込みます。<br>
      サイドバーが引っ込むと、このメイン領域が自動的に左側へ広がります。
    </p>
  </main>

  <!-- JavaScript -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');

    toggleBtn.addEventListener('click', () => {
      // sidebar要素に対して、collapsedクラスを付け外しする
      sidebar.classList.toggle('collapsed');
    });
  </script>
</body>
</html>
