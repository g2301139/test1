<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベアウェザー：秋田県 天気＆安全対策</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />

<style>
html, body {
  height: 100%; width: 100%; margin: 0; padding: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #f0f3f6; color: #333; overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: #1e293b; color: #fff; flex-shrink: 0; z-index: 1000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.header h1 { font-size: 16px; font-weight: bold; margin: 0; }
.header-date { font-size: 13px; color: #94a3b8; }
.dashboard { display: flex; flex-direction: column; flex: 1; height: 100%; width: 100%; overflow: hidden; }

.weather-bear-alert {
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  color: #fff; padding: 15px 20px; display: flex; gap: 15px; align-items: center;
  flex-shrink: 0; box-shadow: inset 0 -3px 6px rgba(0,0,0,0.15);
}
.w-card {
  display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.2);
  padding: 10px 16px; border-radius: 12px; flex-shrink: 0; backdrop-filter: blur(4px);
}
.w-info .w-temp { font-size: 24px; font-weight: bold; }
.w-info .w-text { font-size: 12px; opacity: 0.9; white-space: nowrap; font-weight: 500; }
.alert-message { flex: 1; }
.alert-message .alert-title { font-size: 15px; font-weight: bold; margin: 0; }
.alert-message .alert-desc { font-size: 12px; opacity: 0.95; margin-top: 4px; line-height: 1.4; }

.content-body { display: flex; flex-direction: row; flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; }

.sidebar {
  width: 380px; min-width: 380px; background: #fff; border-right: 1px solid #e2e8f0;
  display: flex; flex-direction: column; height: 100%; flex-shrink: 0; z-index: 10;
}
.sidebar-scroll-wrapper { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.weather-advice { padding: 12px 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 13px; line-height: 1.5; color: #334155; }
.weather-advice h3 { font-size: 14px; color: #0f172a; margin-top: 0; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }

.weather-forecast-container { padding: 12px 15px; background: #ffffff; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
.weather-forecast-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 8px; }
.weather-timeline { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.forecast-item {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; min-width: 70px; text-align: center;
}
.forecast-time { font-size: 11px; color: #64748b; font-weight: bold; }
.forecast-icon { font-size: 20px; margin: 4px 0; }
.forecast-temp { font-size: 13px; font-weight: bold; color: #1e293b; }
.weather-details-mini { margin-top: 6px; width: 100%; font-size: 10px; border-top: 1px dashed #e2e8f0; padding-top: 4px; }
.w-info-mini.pop { color: #2563eb; font-weight: 500; }

.filter-box { padding: 12px; border-bottom: 1px solid #e2e8f0; background: #fff; }
#type-filters { display: flex; gap: 6px; }
.fbtn { flex: 1; padding: 8px 6px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-size: 12px; cursor: pointer; text-align: center; font-weight: bold; }
.fbtn.on { background: #1e293b; color: #fff; border-color: #1e293b; }

.list-hdr { padding: 8px 12px; background: #f1f5f9; font-size: 12px; font-weight: bold; color: #64748b; }
.list-scroll { flex: 1; overflow-y: auto; background: #fff; }
.sitem { padding: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

#map { flex: 1; height: 100%; width: 100%; background: #e5e9f0; position: relative; }
.map-control-overlay {
  position: absolute; top: 15px; left: 15px; z-index: 2000;
  background: rgba(255,255,255,0.95); padding: 12px; border-radius: 12px;
  border: 3px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 260px;
}
.map-ctrl-btn { width: 100%; padding: 10px; margin-bottom: 6px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; }
#btn-radar-toggle { background: #2563eb; }
#btn-alarm { background: linear-gradient(135deg, #dc2626, #7f1d1d); }

.radar-ui-wrapper { 
  background: #ffffff; border-radius: 8px; padding: 12px; margin-top: 8px; 
  border: 2px solid #3b82f6; box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
}
.radar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.r-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
.r-badge.past { background: #e2e8f0; color: #475569; }
.r-badge.future { background: #fef08a; color: #854d0e; }
.r-time { font-size: 16px; font-weight: bold; color: #1e3a8a; }

.radar-slider { 
  -webkit-appearance: none; width: 100%; height: 8px; 
  background: linear-gradient(to right, #94a3b8 15%, #3b82f6 50%, #f59e0b 85%); 
  border-radius: 4px; outline: none; margin: 12px 0; 
}
.radar-slider::-webkit-slider-thumb { 
  -webkit-appearance: none; width: 24px; height: 24px; 
  border-radius: 50%; background: #fff; border: 3px solid #1e3a8a; cursor: pointer; 
}

.slider-sync-info { background: #eff6ff; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; color: #1e293b; border: 1px dashed #93c5fd; }
.slider-w-pop { color: #dc2626; }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>ベアウェザー：秋田県 天気＆安全対策</h1>
    <div class="header-date" id="current-date">--年--月--日</div>
  </div>
  
  <div class="dashboard">
    <div class="weather-bear-alert">
      <div class="w-card"><div id="weather-icon">☁️</div><div class="w-info"><div class="w-temp" id="weather-temp">--°C</div><div class="w-text" id="weather-text">読込中...</div></div></div>
      <div class="alert-message"><div class="alert-title">状況同期完了</div><div class="alert-desc" id="dynamic-alert-text">安全情報と気象データを統合しています。</div></div>
    </div>
    
    <div class="content-body">
      <div class="sidebar">
        <div class="sidebar-scroll-wrapper">
          <div class="weather-advice"><h3>💡 気象連動アドバイス</h3><p id="weather-advice-text">周囲の状況に注意してください。</p></div>
          <div class="weather-forecast-container"><div class="weather-forecast-title">⏳ 3時間ごとの天気予報</div><div class="weather-timeline" id="weather-timeline"></div></div>
          <div class="list-hdr">直近の注意情報</div>
          <div class="list-scroll" id="sightings-list"></div>
        </div>
      </div>
      
      <div id="map">
        <div class="map-control-overlay" id="map-ui">
          <button class="map-ctrl-btn" id="btn-alarm">🚨 緊急サイレン</button>
          <button class="map-ctrl-btn" id="btn-radar-toggle">🌧️ 雨雲レーダーを表示</button>
          
          <div class="radar-ui-wrapper" id="radar-slider-box" style="display: none;">
            <div class="radar-header"><span class="r-badge past">過去</span><span class="r-time" id="time-label">--:--</span><span class="r-badge future">未来</span></div>
            <input type="range" id="radar-time-slider" min="0" max="0" value="0" class="radar-slider">
            <div class="slider-sync-info" id="slider-sync-info">同期中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let map = null, radarLayer = null;
let js_urls = [], js_labels = [], js_dates = [], hourlyWeatherData = null;

// 時刻ラベルフォーマット
function formatTimeLabel(dateObj, diffMins) {
  const pad = n => String(n).padStart(2, '0');
  const hhmm = `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
  if (Math.abs(diffMins) <= 5) return `${hhmm} (現在)`;
  if (diffMins < 0) return `${hhmm} (${Math.abs(diffMins)}分前)`;
  const h = Math.floor(diffMins / 60);
  const m = diffMins % 60;
  return m === 0 ? `${hhmm} (${h}時間後)` : `${hhmm} (${h}時間${m}分後)`;
}

// 💡 ここが修正済みの気象庁データ取得関数
async function fetchJmaRadarTimestamps() {
  const ts = Date.now();
  const urls = [
    `https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?_=${ts}`,
    `https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json?_=${ts}`,
    `https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N3.json?_=${ts}`
  ];
  
  let allTargets = [];
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) allTargets = allTargets.concat(data);
      }
    } catch (e) {}
  }
  
  // ソートして重複排除
  allTargets.sort((a, b) => a.validtime.localeCompare(b.validtime));
  const uniqueTargets = [];
  const seen = new Set();
  allTargets.forEach(t => {
    const key = `${t.basetime}_${t.validtime}`;
    if (!seen.has(key)) { seen.add(key); uniqueTargets.push(t); }
  });

  const now = new Date();
  js_urls = []; js_labels = []; js_dates = [];
  
  uniqueTargets.forEach(t => {
    const vDate = new Date(Date.UTC(parseInt(t.validtime.substring(0,4)), parseInt(t.validtime.substring(4,6)) - 1, parseInt(t.validtime.substring(6,8)), parseInt(t.validtime.substring(8,10)), parseInt(t.validtime.substring(10,12))));
    const diffMins = Math.round((vDate - now) / 60000);
    
    if (diffMins < -60) return; 

    // 💡 フォルダ自動判定ロジック
    let element = "hrpns";
    if (t.elements && Array.isArray(t.elements)) {
      if (t.elements.includes("hrpns_nd")) element = "hrpns_nd"; // 1時間以降はこちら
      else if (t.elements.includes("hrpns")) element = "hrpns";
    }
    
    js_urls.push(`https://www.jma.go.jp/bosai/jmatile/data/nowc/${t.basetime}/none/${t.validtime}/surf/${element}/{z}/{x}/{y}.png`);
    js_dates.push(vDate);
    js_labels.push(formatTimeLabel(vDate, diffMins));
  });

  const slider = document.getElementById('radar-time-slider');
  slider.max = js_urls.length - 1;
  let closestIdx = 0, minDiff = Infinity;
  js_dates.forEach((d, i) => { const diff = Math.abs(d - now); if (diff < minDiff) { minDiff = diff; closestIdx = i; } });
  slider.value = closestIdx;
  document.getElementById('time-label').textContent = js_labels[closestIdx];
}

// 初期化
window.onload = () => {
  map = L.map('map', { zoomControl: false }).setView([39.7, 140.1], 8);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png').addTo(map);
  fetchJmaRadarTimestamps();

  document.getElementById('btn-radar-toggle').onclick = function() {
    const box = document.getElementById('radar-slider-box');
    const isVisible = box.style.display === 'block';
    box.style.display = isVisible ? 'none' : 'block';
    this.textContent = isVisible ? '🌧️ 雨雲レーダーを表示' : '☀️ 雨雲を消す';
    if (!isVisible) updateRadarLayer();
    else if(radarLayer) map.removeLayer(radarLayer);
  };

  document.getElementById('radar-time-slider').oninput = function() {
    document.getElementById('time-label').textContent = js_labels[this.value];
    updateRadarLayer();
  };
};

function updateRadarLayer() {
  if(radarLayer) map.removeLayer(radarLayer);
  radarLayer = L.tileLayer(js_urls[document.getElementById('radar-time-slider').value], { opacity: 0.6, zIndex: 1500 }).addTo(map);
}
</script>
</body>
</html>
