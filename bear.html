<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秋田市 安全対策マップ（15時間雨雲＆熊情報）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* レーダー用コントロールパネル（下部） */
    #radar-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 500px;
    }
    .time-display {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #333;
    }
    .slider-row {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 15px;
    }
    button {
      background: #007BFF;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,123,255,0.3);
      font-weight: bold;
    }
    button:hover { background: #0056b3; }
    input[type="range"] {
      flex-grow: 1;
      cursor: pointer;
    }

    /* ツールボタン群（右上） */
    #tools {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tool-btn {
      background: white;
      color: #333;
      border: 2px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #f0f0f0; }
    .btn-gps { border-color: #28a745; color: #28a745; }
    .btn-bear { border-color: #dc3545; color: #dc3545; }

    /* 熊アイコンのスタイル */
    .bear-icon {
      font-size: 24px;
      line-height: 1;
      filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- 右上のツールボタン -->
<div id="tools">
  <button class="tool-btn btn-gps" id="gps-btn">📍 現在地へ</button>
  <button class="tool-btn btn-bear" id="bear-btn">🐻 熊の出没情報: ON</button>
</div>

<!-- 下部のレーダー操作パネル -->
<div id="radar-controls">
  <div class="time-display" id="time-label">雨雲データ読み込み中...</div>
  <div class="slider-row">
    <button id="play-btn">▶ 再生</button>
    <input type="range" id="radar-time-slider" min="0" max="0" value="0">
  </div>
</div>

<script>
  // ==========================================
  // 1. 地図の初期設定
  // ==========================================
  const map = L.map('map').setView([39.7200, 140.1026], 11); // 秋田市中心部
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    opacity: 0.8
  }).addTo(map);

  // ==========================================
  // 2. 熊の出没情報機能
  // ==========================================
  // ※ダミーデータ：秋田市周辺の山際などを想定したサンプル座標
  const bearData = [
    { lat: 39.750, lng: 140.180, info: "太平山麓付近で目撃" },
    { lat: 39.780, lng: 140.120, info: "仁別エリア 痕跡あり" },
    { lat: 39.680, lng: 140.150, info: "雄和方面 道路横断" }
  ];

  const bearLayerGroup = L.layerGroup().addTo(map);
  const bearIcon = L.divIcon({
    html: '<div class="bear-icon">🐻</div>',
    className: 'custom-div-icon',
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });

  bearData.forEach(bear => {
    L.marker([bear.lat, bear.lng], { icon: bearIcon })
      .bindPopup(`<b>熊出没注意</b><br>${bear.info}`)
      .addTo(bearLayerGroup);
  });

  let bearVisible = true;
  document.getElementById('bear-btn').addEventListener('click', (e) => {
    if (bearVisible) {
      map.removeLayer(bearLayerGroup);
      e.target.textContent = "🐻 熊の出没情報: OFF";
      e.target.style.color = "#ccc";
      e.target.style.borderColor = "#ccc";
    } else {
      map.addLayer(bearLayerGroup);
      e.target.textContent = "🐻 熊の出没情報: ON";
      e.target.style.color = "#dc3545";
      e.target.style.borderColor = "#dc3545";
    }
    bearVisible = !bearVisible;
  });

  // ==========================================
  // 3. GPS 現在地取得機能
  // ==========================================
  let userMarker = null;
  document.getElementById('gps-btn').addEventListener('click', () => {
    map.locate({ setView: true, maxZoom: 13 });
  });

  map.on('locationfound', (e) => {
    if (userMarker) { map.removeLayer(userMarker); }
    userMarker = L.marker(e.latlng).addTo(map)
      .bindPopup("あなたの現在地").openPopup();
  });

  map.on('locationerror', (e) => {
    alert("現在地を取得できませんでした。端末のGPS設定を確認してください。");
  });


  // ==========================================
  // 4. 15時間 雨雲レーダー機能
  // ==========================================
  let js_urls = [];
  let radarLayer = null;
  let playInterval = null;

  const slider = document.getElementById('radar-time-slider');
  const timeLabel = document.getElementById('time-label');
  const playBtn = document.getElementById('play-btn');

  async function fetchJmaRadarTimestamps() {
    const ts = Date.now();
    const endpoints = [
      { url: `https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json?_=${ts}`, type: 'nowc' },
      { url: `https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json?_=${ts}`, type: 'nowc' },
      { url: `https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N3.json?_=${ts}`, type: 'nowc' },
      { url: `https://www.jma.go.jp/bosai/jmatile/data/prpn/targetTimes_N1.json?_=${ts}`, type: 'prpn' },
      { url: `https://www.jma.go.jp/bosai/jmatile/data/prpn/targetTimes_N2.json?_=${ts}`, type: 'prpn' },
      { url: `https://www.jma.go.jp/bosai/jmatile/data/prpn/targetTimes_N3.json?_=${ts}`, type: 'prpn' }
    ];

    try {
      const results = await Promise.all(endpoints.map(ep => 
        fetch(ep.url)
          .then(res => res.ok ? res.json() : [])
          .then(data => Array.isArray(data) ? data.map(d => ({ ...d, _type: ep.type })) : [])
          .catch(() => [])
      ));
      
      const allTargets = results.flat();
      const uniqueTargetsMap = new Map();
      const now = new Date();

      allTargets.forEach(t => {
        const vDate = new Date(Date.UTC(
          parseInt(t.validtime.substring(0,4), 10), 
          parseInt(t.validtime.substring(4,6), 10) - 1, 
          parseInt(t.validtime.substring(6,8), 10), 
          parseInt(t.validtime.substring(8,10), 10), 
          parseInt(t.validtime.substring(10,12), 10)
        ));
        
        const diffMins = Math.round((vDate - now) / 60000);
        if (diffMins < -60 || diffMins > 960) return;

        let element = "";
        if (t.elements && Array.isArray(t.elements)) {
          if (t.elements.includes("hrpns_nd")) element = "hrpns_nd";
          else if (t.elements.includes("hrpns")) element = "hrpns";
          else if (t.elements.includes("prpn")) element = "prpn";
        }
        if (!element) element = t._type === 'prpn' ? "prpn" : "hrpns";

        const item = {
          validtime: t.validtime,
          basetime: t.basetime,
          diffMins: diffMins,
          url: `https://www.jma.go.jp/bosai/jmatile/data/${t._type}/${t.basetime}/none/${t.validtime}/surf/${element}/{z}/{x}/{y}.png`,
          _type: t._type
        };

        const existing = uniqueTargetsMap.get(t.validtime);
        if (!existing) {
          uniqueTargetsMap.set(t.validtime, item);
        } else {
          const score = type => type === 'nowc' ? 2 : 1;
          if (score(t._type) > score(existing._type)) {
            uniqueTargetsMap.set(t.validtime, item);
          } else if (score(t._type) === score(existing._type)) {
            if (t.basetime > existing.basetime) {
              uniqueTargetsMap.set(t.validtime, item);
            }
          }
        }
      });

      js_urls = Array.from(uniqueTargetsMap.values()).sort((a, b) => a.validtime.localeCompare(b.validtime));
      
      if (js_urls.length > 0) {
        slider.max = js_urls.length - 1;
        let startIndex = 0;
        let minDiff = Infinity;
        js_urls.forEach((t, i) => {
          const absDiff = Math.abs(t.diffMins);
          if (absDiff < minDiff) {
            minDiff = absDiff;
            startIndex = i;
          }
        });
        slider.value = startIndex;
        updateRadarLayer(startIndex);
      } else {
        timeLabel.textContent = "レーダーデータが見つかりません";
      }
    } catch (e) {
      console.error(e);
      timeLabel.textContent = "データ取得エラー";
    }
  }

  function updateRadarLayer(index) {
    if (js_urls.length === 0) return;
    const target = js_urls[index];
    
    if (radarLayer) map.removeLayer(radarLayer);

    const maxNativeZ = target._type === 'nowc' ? 10 : 8;

    radarLayer = L.tileLayer(target.url, {
      opacity: 0.65,
      maxNativeZoom: maxNativeZ,
      minZoom: 4,
      attribution: "気象庁"
    });
    
    radarLayer.addTo(map);
    timeLabel.textContent = formatTimeLabel(target.diffMins, target.validtime);
  }

  function formatTimeLabel(diffMins, validtime) {
    const vDate = new Date(Date.UTC(
      parseInt(validtime.substring(0,4), 10), 
      parseInt(validtime.substring(4,6), 10) - 1, 
      parseInt(validtime.substring(6,8), 10), 
      parseInt(validtime.substring(8,10), 10), 
      parseInt(validtime.substring(10,12), 10)
    ));
    
    const hStr = vDate.getHours().toString().padStart(2, '0');
    const mStr = vDate.getMinutes().toString().padStart(2, '0');
    const hhmm = `${hStr}:${mStr}`;

    if (diffMins < 0) {
      const m = Math.abs(diffMins);
      if (m >= 60) {
        const mh = Math.floor(m / 60);
        const mm = m % 60;
        return mm === 0 ? `${hhmm} (${mh}時間前)` : `${hhmm} (${mh}時間${mm}分前)`;
      }
      return `${hhmm} (${m}分前)`;
    } else if (diffMins === 0) {
      return `${hhmm} (現在)`;
    } else {
      const h = Math.floor(diffMins / 60);
      const m = diffMins % 60;
      if (h === 0) return `${hhmm} (${m}分後)`;
      return m === 0 ? `${hhmm} (${h}時間後)` : `${hhmm} (${h}時間${m}分後)`;
    }
  }

  slider.addEventListener('input', (e) => updateRadarLayer(e.target.value));

  playBtn.addEventListener('click', () => {
    if (playInterval) {
      clearInterval(playInterval);
      playInterval = null;
      playBtn.textContent = '▶ 再生';
    } else {
      playBtn.textContent = '■ 停止';
      playInterval = setInterval(() => {
        let nextVal = parseInt(slider.value) + 1;
        if (nextVal >= js_urls.length) nextVal = 0;
        slider.value = nextVal;
        updateRadarLayer(nextVal);
      }, 800);
    }
  });

  fetchJmaRadarTimestamps();
</script>

</body>
</html>
