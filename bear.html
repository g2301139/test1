<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベアウェザー：秋田県 天気＆安全対策</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />

<style>
html, body {
  height: 100%; width: 100%; margin: 0; padding: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #f0f3f6; color: #333; overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: #1e293b; color: #fff; flex-shrink: 0; z-index: 1000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.header h1 { font-size: 16px; font-weight: bold; margin: 0; }
.header-date { font-size: 13px; color: #94a3b8; }
.dashboard { display: flex; flex-direction: column; flex: 1; height: 100%; width: 100%; overflow: hidden; }

/* 特大アラートバナー */
.weather-bear-alert {
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  color: #fff; padding: 15px 20px; display: flex; gap: 15px; align-items: center;
  flex-shrink: 0; box-shadow: inset 0 -3px 6px rgba(0,0,0,0.15);
  transition: background 0.5s ease;
}
.w-card {
  display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.2);
  padding: 10px 16px; border-radius: 12px; flex-shrink: 0; backdrop-filter: blur(4px);
}
.w-info .w-temp { font-size: 24px; font-weight: bold; }
.w-info .w-text { font-size: 12px; opacity: 0.9; white-space: nowrap; font-weight: 500; }
.alert-message { flex: 1; }
.alert-message .alert-title { font-size: 15px; font-weight: bold; margin: 0; }
.alert-message .alert-desc { font-size: 12px; opacity: 0.95; margin-top: 4px; line-height: 1.4; }

.content-body { display: flex; flex-direction: row; flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; }

/* サイドバー */
.sidebar {
  width: 380px; min-width: 380px; background: #fff; border-right: 1px solid #e2e8f0;
  display: flex; flex-direction: column; height: 100%; flex-shrink: 0; z-index: 10;
}
.sidebar-scroll-wrapper { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

.weather-advice { padding: 12px 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 13px; line-height: 1.5; color: #334155; }
.weather-advice h3 { font-size: 14px; color: #0f172a; margin-top: 0; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }

/* 3時間予報 */
.weather-forecast-container { padding: 12px 15px; background: #ffffff; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
.weather-forecast-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 8px; }
.weather-timeline { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.weather-timeline::-webkit-scrollbar { height: 6px; }
.weather-timeline::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
.weather-timeline::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
.forecast-item {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; min-width: 70px; text-align: center;
}
.forecast-time { font-size: 11px; color: #64748b; font-weight: bold; }
.forecast-icon { font-size: 20px; margin: 4px 0; }
.forecast-temp { font-size: 13px; font-weight: bold; color: #1e293b; }
.weather-details-mini { margin-top: 6px; width: 100%; font-size: 10px; border-top: 1px dashed #e2e8f0; padding-top: 4px; }
.w-info-mini.pop { color: #2563eb; font-weight: 500; }

.filter-box { padding: 12px; border-bottom: 1px solid #e2e8f0; background: #fff; }
#type-filters { display: flex; gap: 6px; }
.fbtn { flex: 1; padding: 6px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; font-size: 12px; cursor: pointer; text-align: center; font-weight: bold; }
.fbtn.on { background: #1e293b; color: #fff; border-color: #1e293b; }
.fbtn.on-orange { background: #ea580c; color: #fff; border-color: #ea580c; }

.list-hdr { padding: 8px 12px; background: #f1f5f9; font-size: 12px; font-weight: bold; color: #64748b; }
.list-scroll { flex: 1; overflow-y: auto; background: #fff; }

/* 取り消しボタン付きリストアイテム */
.sitem { padding: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.sitem:hover { background: #f8fafc; }
.sitem-content { flex: 1; }
.sitem-title { font-weight: bold; font-size: 13px; color: #1e293b; margin-bottom: 4px; }
.sitem-meta { font-size: 11px; color: #64748b; }
.type-tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; color: #fff; margin-top: 4px; }
.tag-熊の目撃 { background: #64748b; }
.tag-熊の人身被害 { background: #dc2626; }
.btn-delete { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; margin-left: 8px; }
.btn-delete:hover { background: #b91c1c; }

.action-panel { padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; }
.btn-primary { width: 100%; padding: 10px; background: #16a34a; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }

/* 🗺️ マップエリア */
#map { flex: 1; height: 100%; width: 100%; background: #e5e9f0; position: relative; }

.map-control-overlay {
  position: absolute; top: 15px; left: 15px; z-index: 2000;
  background: rgba(255,255,255,0.95); padding: 12px; border-radius: 12px;
  border: 3px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 220px;
}
.map-ctrl-btn { width: 100%; padding: 10px; margin-bottom: 6px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; }
#btn-radar-toggle { background: #2563eb; }
#btn-bear-toggle { background: #475569; }
#btn-gps { background: #16a34a; }
.slider-container { background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; margin-top: 8px; }
.slider-label { font-size: 12px; font-weight: bold; text-align: center; color: #0f172a; }
.time-display { color: #dc2626; font-weight: bold; }
.range-slider { width: 100%; cursor: pointer; margin-top: 4px; }

/* 投稿モーダル */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-window { background: #fff; border-radius: 8px; width: 100%; max-width: 500px; display: flex; flex-direction: column; overflow: hidden; padding: 16px; gap: 12px; }
.form-grp { display: flex; flex-direction: column; gap: 4px; }
.form-grp label { font-size: 12px; font-weight: bold; color: #475569; }
.form-grp input, .form-grp select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }

#loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: bold; }

@media (max-width: 768px) {
  .content-body { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; height: 45%; border-bottom: 1px solid #cbd5e1; }
  .sidebar-scroll-wrapper { overflow-y: auto; }
  .list-scroll { overflow-y: visible; height: auto; flex: none; }
  #map { width: 100%; height: 55%; }
  .map-control-overlay { top: 10px; left: 10px; width: 150px; padding: 6px; }
  .map-ctrl-btn { padding: 8px; font-size: 11px; margin-bottom: 4px; }
}
</style>
</head>
<body>

<div id="loading">クラウドデータベースと同期中...</div>

<div id="app" style="display:none;">
  <div class="header">
    <h1>ベアウェザー：秋田県 天気＆リアルタイム安全対策</h1>
    <div class="header-date" id="current-date">----年--月--日</div>
  </div>
  
  <div class="dashboard">
    <div class="weather-bear-alert" id="alert-bar">
      <div class="w-card">
        <div style="font-size: 32px; margin-right: 2px;" id="weather-icon">☁️</div>
        <div class="w-info">
          <div class="w-temp" id="weather-temp">--°C</div>
          <div class="w-text" id="weather-text">読込中...</div>
        </div>
      </div>
      <div class="alert-message">
        <div class="alert-title" id="alert-title">同期完了</div>
        <div class="alert-desc" id="dynamic-alert-text">周囲の目撃状況をチェックしています。</div>
      </div>
    </div>
    
    <div class="content-body">
      <div class="sidebar">
        <div class="sidebar-scroll-wrapper">
          <div class="weather-advice">
            <h3>💡 本日の気象連動アドバイス</h3>
            <p id="weather-advice-text">周囲の状況に注意し、見通しの悪い場所に入る際は音の出るものを携帯してください。</p>
          </div>
          
          <div class="weather-forecast-container">
            <div class="weather-forecast-title">⏳ 3時間ごとの天気予報（直近24時間）</div>
            <div class="weather-timeline" id="weather-timeline"></div>
          </div>
          
          <div class="filter-box">
            <div id="type-filters">
              <div class="fbtn on" data-t="all">すべて</div>
              <div class="fbtn" data-t="目撃">目撃・痕跡</div>
              <div class="fbtn" data-t="人身被害">人身被害</div>
            </div>
          </div>
          
          <div class="list-hdr" id="list-count">0件の情報</div>
          <div class="list-scroll" id="sightings-list"></div>
          
          <div class="action-panel">
            <button class="btn-primary" id="open-modal">🐻 クマ出没情報を共有する</button>
          </div>
        </div>
      </div>
      
      <div id="map">
        <div class="map-control-overlay" id="map-ui">
          <button class="map-ctrl-btn" id="btn-radar-toggle">🌧️ 雨雲レーダーを表示</button>
          <button class="map-ctrl-btn" id="btn-bear-toggle" style="background: #1e293b;">🐻 熊マーカーを隠す</button>
          <button class="map-ctrl-btn" id="btn-gps">📍 現在地を取得</button>
          <div class="slider-container" id="radar-slider-box" style="display: none;">
            <div class="slider-label">時間: <span class="time-display" id="time-label">-</span></div>
            <input type="range" id="radar-time-slider" min="0" max="0" value="0" class="range-slider">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-window">
    <h3 style="margin:0;">🐾 クマ出没情報の投稿</h3>
    <div class="form-grp">
      <label>情報種別</label>
      <select id="f-type">
        <option value="熊の目撃">熊の目撃・痕跡</option>
        <option value="熊の人身被害">熊の人身被害（重大事態）</option>
      </select>
    </div>
    <div class="form-grp">
      <label>市町村</label>
      <input type="text" id="f-city" placeholder="例：秋田市">
    </div>
    <div class="form-grp">
      <label>詳しい場所・地番</label>
      <input type="text" id="f-loc" placeholder="例：〇〇千秋公園付近の林道">
    </div>
    <div style="display:flex; justify-content:end; gap:10px; margin-top:10px;">
      <button id="cancel-btn" style="padding:8px 16px; background:#e2e8f0; border:none; border-radius:4px; cursor:pointer;">キャンセル</button>
      <button id="submit-btn" style="padding:8px 20px; background:#16a34a; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">送信して全員に共有</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ========================================================
// ⚠️ 【★ここを書き換える★】FirebaseのWeb設定コードを貼り付けてください
// ========================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// 初期化
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let CSV_DATA = [];
let map = null, markers = null, radarLayer = null, userMarker = null;
let currentFilterType = 'all';
let js_urls = [];
let js_labels = [];
let isRadarActive = false;
let isBearActive = true;

window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  document.getElementById('current-date').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  
  // 1. マップとUIの基礎設定
  initMap();
  // 2. 雨雲データの読み込み
  fetchJmaRadarTimestamps();
  // 3. OpenMeteo天気予報の取得
  loadOpenMeteoForecast();
  // 4. Firebaseからリアルタイムにデータを取得して同期（他の人の投稿も即反映！）
  syncFirebaseData();
});

function initMap() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  
  const baseTile = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { attribution: '国土地理院' });
  map = L.map('map', { zoomControl: false, minZoom: 7, maxZoom: 18, layers: [baseTile] }).setView([39.65, 140.1], 8);
  L.control.zoom({ position: 'topright' }).addTo(map);

  markers = L.markerClusterGroup({ spiderfyOnMaxZoom: true, showCoverageOnHover: false });
  map.addLayer(markers);

  const mapUi = document.getElementById('map-ui');
  ['mousedown', 'touchstart', 'dblclick', 'wheel'].forEach(evt => {
    mapUi.addEventListener(evt, e => e.stopPropagation());
  });

  initEvents();
}

function syncFirebaseData() {
  // collection(db, "bear_reports") の変更をリアルタイム監視
  onSnapshot(collection(db, "bear_reports"), (snapshot) => {
    CSV_DATA = [];
    snapshot.forEach((doc) => {
      let data = doc.data();
      data.id = doc.id; // 削除用にドキュメントIDを保存
      CSV_DATA.push(data);
    });
    render();
    loadOpenMeteoForecast(); // バナーの色判定を再更新
  });
}

function loadOpenMeteoForecast() {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=39.7186&longitude=140.1023&current_weather=true&hourly=temperature_2m,weathercode,precipitation_probability&timezone=Asia%2FTokyo`)
    .then(res => res.json())
    .then(data => {
      if(!data || !data.current_weather) return;
      const cur = data.current_weather;
      document.getElementById('weather-temp').textContent = `${cur.temperature}°C`;
      
      let wText = "曇り"; let wIcon = "☁️";
      if (cur.weathercode === 0 || cur.weathercode === 1) { wText = "晴れ"; wIcon = "☀️"; }
      else if (cur.weathercode >= 51 && cur.weathercode <= 67) { wText = "雨"; wIcon = "🌧️"; }
      else if (cur.weathercode >= 95) { wText = "雷雨"; wIcon = "⛈️"; }

      document.getElementById('weather-icon').textContent = wIcon;
      document.getElementById('weather-text').textContent = `秋田市: ${wText}`;

      const hasDanger = CSV_DATA.some(d => d["情報種別"] === "熊の人身被害");
      const alertBar = document.getElementById('alert-bar');
      if (hasDanger) {
        alertBar.style.background = "linear-gradient(135deg, #7f1d1d 0%, #dc2626 100%)";
        document.getElementById('alert-title').textContent = "🔴 🚨 クマ危険度【極めて高い・人身被害報告あり】";
        document.getElementById('weather-advice-text').textContent = "⚠️【緊急警告】人身被害情報がクラウドに同期されました。対象エリアへの不要不急の立ち入りは絶対に避けてください！";
        document.getElementById('dynamic-alert-text').textContent = "毎日の天気チェックと同時に、下の出没マップを確認してください。";
      } else if (CSV_DATA.length > 0) {
        alertBar.style.background = "linear-gradient(135deg, #c2410c 0%, #ea580c 100%)";
        document.getElementById('alert-title').textContent = "🟡 クマ危険度【中・リアルタイム目撃あり】";
        document.getElementById('weather-advice-text').textContent = "🐾 近隣で目撃報告があります。朝夕や雨の日の行動は十分注意してください。";
        document.getElementById('dynamic-alert-text').textContent = "最新の投稿内容が自動反映されています。";
      } else {
        alertBar.style.background = "linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%)";
        document.getElementById('alert-title').textContent = "🟢 クマ危険度【低】（現在データなし）";
        document.getElementById('weather-advice-text').textContent = "周囲の状況に注意し、見通しの悪い場所に入る際は音の出るものを携帯してください。";
        document.getElementById('dynamic-alert-text').textContent = "現在のところ新しい目撃報告はありません。";
      }

      // 3時間タイムライン
      const timeline = document.getElementById('weather-timeline');
      let tHtml = '';
      for(let i=0; i<8; i++) {
        const idx = i * 3;
        const time = data.hourly.time[idx].split('T')[1].substring(0,5);
        const temp = data.hourly.temperature_2m[idx];
        const pop = data.hourly.precipitation_probability[idx];
        tHtml += `<div class="forecast-item"><div class="forecast-time">${time}</div><div class="forecast-icon">${wIcon}</div><div class="forecast-temp">${temp}°C</div><div class="weather-details-mini"><div class="w-info-mini pop">☔${pop}%</div></div></div>`;
      }
      timeline.innerHTML = tHtml;
    });
}

function render() {
  if (!map) return;
  markers.clearLayers();
  const listEl = document.getElementById('sightings-list');
  listEl.innerHTML = '';
  let count = 0;

  CSV_DATA.forEach(d => {
    const type = d["情報種別"];
    if (currentFilterType !== 'all' && !type.includes(currentFilterType)) return;
    count++;

    const lat = parseFloat(d["緯度"]); const lng = parseFloat(d["経度"]);
    if (!isNaN(lat) && !isNaN(lng)) {
      const col = type.includes('人身') ? '#dc2626' : '#64748b';
      const m = L.circleMarker([lat, lng], { radius: 9, fillColor: col, color: '#fff', weight: 2, fillOpacity: 0.8 });
      m.bindPopup(`<b>${type}</b><br>${d["発生日時"]}<br>${d["地番情報"]}`);
      markers.addLayer(m);
    }

    // 削除ボタン付きのリストアイテムを生成
    const item = document.createElement('div');
    item.className = 'sitem';
    item.innerHTML = `
      <div class="sitem-content" onclick="map.setView([${lat},${lng}], 14)">
        <div class="sitem-title">${d["地番情報"] || '秋田県内'}</div>
        <div class="sitem-meta">${d["発生日時"]} | ${d["市町村"]}</div>
        <span class="type-tag tag-${type}">${type}</span>
      </div>
    `;
    
    // 【機能追加】取り消し（削除）ボタンの配置
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-delete';
    delBtn.textContent = '❌ 取り消し';
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if(confirm("この投稿を取り消しますか？（他の人の画面からも消去されます）")) {
        await deleteDoc(doc(db, "bear_reports", d.id));
      }
    };
    item.appendChild(delBtn);
    listEl.appendChild(item);
  });
  document.getElementById('list-count').textContent = `${count} 件の情報`;
}

// 投稿送信処理
async function submitPost() {
  const type = document.getElementById('f-type').value;
  const city = document.getElementById('f-city').value;
  const loc = document.getElementById('f-loc').value;
  
  if(!city || !loc) { alert("市町村と詳しい場所を入力してください。"); return; }

  // 簡易的にマップの中心にピンを立てる（GPSマーカーがあればその位置）
  let targetLat = map.getCenter().lat;
  let targetLng = map.getCenter().lng;
  if(userMarker) { targetLat = userMarker.getLatLng().lat; targetLng = userMarker.getLatLng().lng; }

  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:00`;

  const newReport = {
    "情報種別": type,
    "市町村": city,
    "地番情報": loc,
    "発生日時": dateStr,
    "緯度": targetLat,
    "経度": targetLng
  };

  try {
    // Firebaseに保存（これで自動的に他の人の画面にも降ってきます）
    await addDoc(collection(db, "bear_reports"), newReport);
    document.getElementById('modal-overlay').classList.remove('open');
    // 入力フォームリセット
    document.getElementById('f-city').value = '';
    document.getElementById('f-loc').value = '';
  } catch (e) {
    alert("送信に失敗しました: " + e);
  }
}

function fetchJmaRadarTimestamps() {
  const currentTs = Date.now();
  const baseUtc = new Date(Math.floor(currentTs / 300000) * 300000 - 9 * 3600000);
  js_urls = []; js_labels = [];
  for (let i = -2; i <= 6; i++) {
    const targetDt = new Date(baseUtc.getTime() + i * 5 * 60000);
    const y = targetDt.getUTCFullYear(); const m = String(targetDt.getUTCMonth() + 1).padStart(2, '0'); const d = String(targetDt.getUTCDate()).padStart(2, '0'); const h = String(targetDt.getUTCHours()).padStart(2, '0'); const min = String(targetDt.getUTCMinutes()).padStart(2, '0');
    const basetime = `${y}${m}${d}${h}${min}00`;
    const prod = i <= 0 ? "nowc" : "prca"; const element = i <= 0 ? "hrpns" : "prca";
    js_urls.push(`https://www.jma.go.jp/bosai/jmatile/data/${prod}/${basetime}/none/${basetime}/surf/${element}/{z}/{x}/{y}.png`);
    const localTime = new Date(targetDt.getTime() + 9 * 3600000);
    const timeStr = `${String(localTime.getHours()).padStart(2,'0')}:${String(localTime.getMinutes()).padStart(2,'0')}`;
    if (i === 0) js_labels.push(`現在 (${timeStr})`); else if (i < 0) js_labels.push(`${Math.abs(i)*5}分前 (${timeStr})`); else js_labels.push(`${i*5}分後 (${timeStr})`);
  }
  const slider = document.getElementById('radar-time-slider');
  slider.max = js_urls.length - 1; slider.value = 2;
  document.getElementById('time-label').textContent = js_labels[2];
}

function updateRadarLayer() {
  const slider = document.getElementById('radar-time-slider');
  if (radarLayer) map.removeLayer(radarLayer);
  radarLayer = L.tileLayer(js_urls[slider.value], { opacity: 0.65, zIndex: 1500 }).addTo(map);
}

function initEvents() {
  document.getElementById('btn-radar-toggle').onclick = function() {
    isRadarActive = !isRadarActive;
    document.getElementById('radar-slider-box').style.display = isRadarActive ? 'block' : 'none';
    if (isRadarActive) { this.style.background = '#ef4444'; this.textContent = '☀️ 雨雲を消す'; updateRadarLayer(); }
    else { this.style.background = '#2563eb'; this.textContent = '🌧️ 雨雲レーダー'; if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; } }
  };
  document.getElementById('radar-time-slider').oninput = function() { document.getElementById('time-label').textContent = js_labels[this.value]; if (isRadarActive) updateRadarLayer(); };
  document.getElementById('btn-bear-toggle').onclick = function() { isBearActive = !isBearActive; if (isBearActive) { this.style.background = '#1e293b'; this.textContent = '🐻 熊マーカーを隠す'; map.addLayer(markers); } else { this.style.background = '#64748b'; this.textContent = '🐻 熊マーカーを表示'; map.removeLayer(markers); } };
  document.getElementById('btn-gps').onclick = () => { if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(pos => { const lat = pos.coords.latitude; const lng = pos.coords.longitude; map.flyTo([lat, lng], 13); if (userMarker) map.removeLayer(userMarker); userMarker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#2563eb', color: '#fff', weight: 2 }).addTo(map).bindPopup("現在地").openPopup(); }); } };
  document.querySelectorAll('#type-filters .fbtn').forEach(btn => { btn.onclick = function() { document.querySelectorAll('#type-filters .fbtn').forEach(b => b.className = 'fbtn'); currentFilterType = this.getAttribute('data-t'); this.classList.add(currentFilterType === 'all' ? 'on' : (currentFilterType.includes('人身') ? 'on-orange' : 'on')); render(); }; });
  document.getElementById('open-modal').onclick = () => document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('cancel-btn').onclick = () => document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('submit-btn').onclick = submitPost;
}
</script>
